[project]
name = "grad"
version = "2.0.0.dev0"
description = "Flight-test data processing and strain-gauge calibration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.4",
    "numpy>=2.1",
    "pandas>=3.0",
    "pyarrow>=18",
    "pyqtgraph>=0.13.7",
    "pyside6>=6.8",
    "scipy>=1.14",
    "statsmodels>=0.14.4",
]

[project.scripts]
grad = "grad.ui.app:main"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grad"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["grad"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
qt_api = "pyside6"

[tool.pyright]
include = ["src", "tests"]
exclude = ["legacy", "**/__pycache__", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
